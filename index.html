<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Hamza | Digital Business Card</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background:
        radial-gradient(circle at top left, #ff6a00 0%, transparent 30%),
        radial-gradient(circle at bottom right, #ff1744 0%, transparent 30%),
        #080808;
      color: white;
    }

    .card {
      width: 100%;
      max-width: 430px;
      padding: 28px 22px;
      text-align: center;

      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 30px;

      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);

      box-shadow: 0 25px 70px rgba(0,0,0,0.6);

      animation: showCard 1s ease;
    }

    @keyframes showCard {
      from {
        opacity: 0;
        transform: translateY(40px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* PROFILE PHOTO */

    .photo-container {
      width: 155px;
      height: 155px;
      margin: 0 auto;

      padding: 5px;

      border-radius: 50%;

      background: linear-gradient(
        135deg,
        #ff8a00,
        #ff3d00,
        #ff1744,
        #ffd000
      );

      animation: photoGlow 2.5s infinite alternate;
    }

    @keyframes photoGlow {
      from {
        box-shadow: 0 0 15px rgba(255,100,0,0.4);
      }

      to {
        box-shadow: 0 0 40px rgba(255,100,0,0.9);
      }
    }

    .photo-container img {
      width: 100%;
      height: 100%;

      object-fit: cover;

      border-radius: 50%;

      border: 4px solid #111;
    }

    /* NAME */

    h1 {
      margin-top: 20px;
      font-size: 36px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .username {
      margin-top: 5px;
      color: #ff7a00;
      font-size: 16px;
      font-weight: bold;
    }

    .line {
      width: 65px;
      height: 3px;
      margin: 16px auto;
      border-radius: 10px;
      background: #ff7a00;
    }

    .bio {
      color: #cccccc;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 22px;
    }

    /* BUTTONS */

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .btn {
      width: 100%;
      min-height: 54px;

      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;

      border: none;
      border-radius: 16px;

      color: white;
      text-decoration: none;

      font-size: 15px;
      font-weight: bold;

      cursor: pointer;

      transition: 0.3s;
    }

    .btn:hover {
      transform: translateY(-3px);
      filter: brightness(1.15);
    }

    .btn:active {
      transform: scale(0.97);
    }

    /* CALL */

    .call {
      background: linear-gradient(135deg, #ff7a00, #ff3d00);
    }

    /* WHATSAPP */

    .whatsapp {
      background: linear-gradient(135deg, #00c853, #009624);
    }

    /* EMAIL */

    .email {
      background: linear-gradient(135deg, #673ab7, #3f51b5);
    }

    /* TIKTOK */

    .tiktok {
      background: linear-gradient(
        135deg,
        #111111,
        #222222
      );

      border: 1px solid #444;
    }

    /* COPY BUTTON */

    .copy {
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.15);
    }

    /* SHARE */

    .share {
      background: linear-gradient(135deg, #444, #111);
    }

    /* FOOTER */

    .footer {
      margin-top: 25px;
      color: #777;
      font-size: 12px;
    }

    .footer span {
      color: #ff7a00;
    }

    /* SMALL PHONES */

    @media (max-width: 380px) {

      body {
        padding: 12px;
      }

      .card {
        padding: 22px 16px;
      }

      .photo-container {
        width: 130px;
        height: 130px;
      }

      h1 {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

  <div class="card">

    <!-- YOUR PHOTO -->
    <div class="photo-container">
      <img src="profile.jpg" alt="Hamza">
    </div>


    <!-- NAME -->
    <h1>Hamza</h1>

    <!-- TIKTOK USERNAME -->
    <div class="username">
      @h.c.b07
    </div>

    <div class="line"></div>

    <p class="bio">
      Welcome to my digital business card.
      Connect with me through the links below.
    </p>


    <div class="buttons">

      <!-- PHONE -->
      <a
        class="btn call"
        href="tel:0946001607">
        📞 Call Me
      </a>


      <!-- WHATSAPP -->
      <a
        class="btn whatsapp"
        href="https://wa.me/251946001607"
        target="_blank">
        💬 WhatsApp
      </a>


      <!-- EMAIL -->
      <a
        class="btn email"
        href="mailto:djh09201@gmail.com">
        📧 Email Me
      </a>


      <!-- TIKTOK -->
      <a
        class="btn tiktok"
        href="https://www.tiktok.com/@h.c.b07"
        target="_blank">
        🎵 TikTok @h.c.b07
      </a>


      <!-- COPY PHONE -->
      <button
        class="btn copy"
        onclick="copyPhone()">
        📋 Copy Phone Number
      </button>


      <!-- COPY EMAIL -->
      <button
        class="btn copy"
        onclick="copyEmail()">
        📋 Copy Email
      </button>


      <!-- SHARE CARD -->
      <button
        class="btn share"
        onclick="shareCard()">
        🔗 Share My Card
      </button>

    </div>


    <!-- FOOTER -->
    <div class="footer">
      © 2026 <span>Hamza</span> • Digital Business Card
    </div>

  </div>


  <script>

    // COPY PHONE NUMBER
    function copyPhone() {

      navigator.clipboard.writeText("0946001607");

      alert("Phone number copied!");
    }


    // COPY EMAIL
    function copyEmail() {

      navigator.clipboard.writeText("djh09201@gmail.com");

      alert("Email copied!");
    }


    // SHARE CARD
    async function shareCard() {

      if (navigator.share) {

        try {

          await navigator.share({
            title: "Hamza - Digital Business Card",
            text: "Connect with Hamza",
            url: window.location.href
          });

        } catch (error) {

          console.log("Share cancelled");

        }

      } else {

        navigator.clipboard.writeText(
          window.location.href
        );

        alert("Card link copied!");

      }
    }

  </script>

</body>
</html>
